<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Restaurante Vitinho's</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fffde7; margin: 0; }
        .login { max-width: 360px; margin: 80px auto; background: white; border-top: 5px solid #c62828; border-radius: 8px; padding: 24px; box-shadow: 0 2px 12px #ddd; }
        h1 { color: #c62828; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; }
        button { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 5px; background: #c62828; color: white; font-weight: bold; cursor: pointer; }
        .erro { color: #b71c1c; }
    </style>
</head>
<body>
    <div class="login">
        <h1>Entrar</h1>
        {% if form.errors %}
            <p class="erro">Usuário ou senha inválidos.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="{{ form.username.id_for_label }}">Usuário</label>
            {{ form.username }}
            <label for="{{ form.password.id_for_label }}">Senha</label>
            {{ form.password }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
