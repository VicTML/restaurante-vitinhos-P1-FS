{% extends 'base.html' %}
{% block conteudo %}
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <h1>{{ titulo }}</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Salvar</button>
            <a href="{% url 'inicio' %}" class="btn" style="background-color: gray;">Voltar</a>
        </form>
    </div>
{% endblock %}
